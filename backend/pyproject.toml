[project]
name = "guarddengue-backend"
version = "0.1.0"
description = "Clinical Decision Support System & Dengue Triage Assistant Backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "qdrant-client>=1.11.0",
    "fastembed>=0.3.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
